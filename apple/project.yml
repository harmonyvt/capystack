name: Capystack

# One multiplatform SwiftUI app (iPhone, iPad, Mac; not Catalyst) plus an iOS widget extension (the Live Activity).
# The generated project is gitignored: `cd apple && xcodegen generate`.
# Info.plists in Config/ are written by XcodeGen from the `info:` blocks below (committed); entitlements are hand-written.
# Generated sources with one writer each (docs/CONTRACT.md section 1):
#   CapystackKit/Sources/CapystackKit/API/Endpoints.generated.swift   api/scripts/gen.mjs
#   Capystack/Design/Tokens.generated.swift                          design/build.mjs

options:
  bundleIdPrefix: com.capybaraharmony
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  CapystackKit:
    path: CapystackKit
  # The app's only third-party package, app target only (docs/CONTRACT.md section 9). Same pin as cobalt.
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.97.0"

targets:
  Capystack:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Capystack
    dependencies:
      - package: CapystackKit
      - package: PostHog
      - target: CapystackWidgets
        embed: true
        platformFilter: iOS
    info:
      path: Config/Capystack-Info.plist
      properties:
        CFBundleDisplayName: capystack
        CFBundleName: capystack
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLName: com.capybaraharmony.capystack
            CFBundleURLSchemes: [capystack]
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The "pull now" hint (docs/CONTRACT.md section 5): a silent push after a write from another device.
        UIBackgroundModes: [remote-notification]
        # The demo job's island (section 8); ignored on the Mac.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
    settings:
      base:
        PRODUCT_NAME: capystack
        PRODUCT_MODULE_NAME: Capystack
        PRODUCT_BUNDLE_IDENTIFIER: com.capybaraharmony.capystack
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": Config/Capystack-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/Capystack-macOS.entitlements

  # The Live Activity (lock screen + Dynamic Island) for the demo job. iOS only.
  CapystackWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: CapystackWidgets
      # The design lane's tokens, so the island uses the same colours and type as the app.
      - path: Capystack/Design/Tokens.generated.swift
    dependencies:
      - package: CapystackKit
    info:
      path: Config/CapystackWidgets-Info.plist
      properties:
        CFBundleDisplayName: capystack
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: CapystackWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.capybaraharmony.capystack.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
